<style>
:root{--bg:#0b100d;--card:#141c17;--line:#2a3a2f;--gold:#ffc933;--red:#ff5a4d;--txt:#e9f0ea;--mut:#8fa496}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hid{display:none!important}
.scr{position:fixed;inset:0;overflow:auto;padding:22px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;touch-action:pan-y;
 background:radial-gradient(900px 500px at 50% -10%,#24402b55,transparent 70%),radial-gradient(700px 400px at 100% 100%,#5a1d1a40,transparent 70%),linear-gradient(#0b100d,#0b100d);}
.scr::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px}
.scr>*{position:relative}
.lang{position:fixed!important;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;background:#ffffff14;color:var(--txt);border:1px solid #ffffff30;padding:7px 14px;border-radius:20px;font-size:13px;backdrop-filter:blur(6px);box-shadow:none}
.hero{text-align:center;margin-top:18px}
.logo{width:78px;height:78px;filter:drop-shadow(0 0 18px #ff5a4d66)}
h1{margin:6px 0 0;font-size:40px;letter-spacing:3px;font-weight:900;line-height:1}h1 span{color:var(--gold);text-shadow:0 0 22px #ffc93355}
.tag{margin:10px auto 0;max-width:420px;color:var(--mut)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chips span{font-size:12px;padding:4px 10px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff1c;color:#cfe0d3}
.card{background:linear-gradient(#18221b,#131b16);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:480px;box-shadow:0 10px 30px #0006}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a4d3f;background:#0b100d;color:#fff;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
button{padding:13px 16px;border:0;border-radius:10px;background:linear-gradient(#ffd74d,#f2b705);color:#1a1400;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #9a7400;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #9a7400}
button.sec{background:#26352b;color:var(--txt);box-shadow:0 4px 0 #121b15}button.sec:active{box-shadow:0 1px 0 #121b15}button:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.small{font-size:12.5px;color:var(--mut)}
.code{font-size:50px;letter-spacing:10px;text-align:center;font-weight:900;color:var(--gold);text-shadow:0 0 24px #ffc93344}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #223027}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 8px currentColor}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:480px}
.how .tile{background:#141c17;border:1px solid var(--line);border-radius:14px;padding:12px}
.how .tile b{display:block;margin-bottom:4px;font-size:14px}.how .tile p{margin:0;font-size:12.5px;color:var(--mut)}.how .tile i{font-style:normal;font-size:22px;display:block;margin-bottom:2px}
.how .wide{grid-column:1/-1}
kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:1px;text-align:center;font:700 12px ui-monospace,Menlo,monospace;color:#fff;background:#2b3a2f;border:1px solid #4a6150;border-bottom-width:3px;border-radius:5px}
@media(max-width:420px){.how{grid-template-columns:1fr}h1{font-size:33px}}
#game{position:fixed;inset:0}#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
 #mbtn{position:fixed;left:10px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:9;width:38px;height:38px;min-width:0;padding:0;border-radius:50%;background:#000a;color:#fff;border:1px solid #fff4;box-shadow:none;font-size:17px}
#kbtn{position:fixed;left:56px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:9;width:38px;height:38px;min-width:0;padding:0;border-radius:50%;background:#000a;color:#fff;border:1px solid #fff4;box-shadow:none;font-size:17px}
#mbtn.pulse{animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px #ffd43b55}}
#keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,360px);max-height:80vh;overflow:auto;background:#10180ff2;border:2px solid #ffd43b;border-radius:14px;padding:14px;z-index:20;display:none;color:#fff}
#keys h4{margin:0 0 6px;color:#ffd43b;display:flex;justify-content:space-between}.kr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}.kr button{min-width:96px;padding:6px 10px;font-size:13px}
#loot{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);min-width:250px;background:#10180fee;border:2px solid #ffd43b;border-radius:14px;padding:12px;display:none;z-index:6;box-shadow:0 10px 40px #000a}
#loot h4{margin:0 0 8px;color:#ffd43b;font-size:15px;display:flex;justify-content:space-between}
#loot button{display:flex;width:100%;justify-content:space-between;margin:4px 0;padding:9px 12px;font-size:14px;background:#26352b;color:#fff;box-shadow:none;border:1px solid #ffffff30}
#loot button:hover{background:#3b5a42}#loot .all{background:linear-gradient(#ffd74d,#f2b705);color:#1a1400}
.hud{position:absolute;pointer-events:none;text-shadow:0 1px 2px #000}
#hp{left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(470px,96vw);text-align:center}
.bar{height:20px;border-radius:7px;background:#000a;overflow:hidden;margin-bottom:4px;border:1px solid #fff4;position:relative}
.bar i{display:block;height:100%;background:#51cf66;transition:width .15s}.wal2{display:inline-block;font-size:26px;font-weight:900;color:#ffd43b;background:#000c;border:2px solid #ffd43b;border-radius:14px;padding:2px 18px;margin-bottom:6px;text-shadow:0 0 12px #ffc93388}
.prs{font-size:11px;background:#000b;border-radius:8px;padding:3px 8px;margin-bottom:5px;display:flex;gap:9px;justify-content:center;flex-wrap:nowrap;white-space:nowrap;border:1px solid #ffffff1f}.bar.ar{height:15px}.bar.ar b{font-size:11px;line-height:14px}.bar.ar i{background:#4dabf7}
.bar b{position:absolute;inset:0;font-size:12px;line-height:19px;text-align:center;color:#fff}
#mk{left:10px;top:calc(10px + env(safe-area-inset-top,0px));font-size:13.5px;background:#000b;padding:8px 10px;border-radius:12px;line-height:1.5;min-width:170px;border:1px solid #ffffff1f}
#mk .wal{font-size:22px;font-weight:900;color:var(--gold)}
#mk .hd{display:flex;justify-content:space-between;color:#9db0a2;font-size:11px;margin-top:4px;padding:0 4px}
.shop{display:grid;grid-template-columns:1fr 62px 66px;gap:6px;padding:3px 4px;border-radius:6px;opacity:.5;cursor:pointer;align-items:center}
.shop.ok{opacity:1;background:#2f7d3a55}.shop.ok:hover{background:#2f7d3a99}.shop span:nth-child(n+2){text-align:right}
#feed{right:10px;top:calc(190px + env(safe-area-inset-top,0px));font-size:12px;max-width:50vw;text-align:right}
#feed div{background:#0007;padding:2px 7px;border-radius:5px;margin-bottom:2px;display:inline-block}#feed{display:flex;flex-direction:column;align-items:flex-end}
.up{color:#69db7c}.dn{color:#ff8787}
#top{right:10px;top:calc(10px + env(safe-area-inset-top,0px));text-align:right;font-size:13px}
#mm{display:block;border-radius:8px;border:1px solid #fff4;margin:4px 0 0 auto;background:#000}
#zt{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:#000a;padding:4px 14px;border-radius:14px;font-size:13px;white-space:nowrap}
#wp{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.slot{background:#000b;border:2px solid #fff3;border-radius:10px;padding:6px 10px;min-width:132px;font-size:12px}
.slot.on{border-color:var(--gold)}.slot b{font-size:14px;display:block}
#btns{position:absolute;right:10px;bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#btns button{pointer-events:auto;min-width:84px;padding:9px;font-size:13px;background:#000a;color:#fff;border:1px solid #fff5;box-shadow:none}
#bpick{background:var(--gold)!important;color:#111!important}
#msg{left:50%;top:38%;transform:translateX(-50%);font-size:22px;font-weight:800;text-align:center;display:none}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px #f00;opacity:0;transition:opacity .35s}
.res td,.res th{padding:6px 8px;text-align:left}.res{width:100%;border-collapse:collapse}

const Mu={ctx:null,on:true,t:0,step:0,nb:null};
try{if(localStorage.getItem('ae_mute')==='1')Mu.on=false}catch(e){}
const CH=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]],RT=[55,43.65,65.41,49],SCL=[440,523.25,587.33,659.25,783.99,880],
 MOT=[[0,-1,2,3,-1,2,0,-1],[1,-1,3,4,-1,3,1,-1],[2,-1,4,5,-1,4,2,3],[1,-1,3,2,-1,1,0,-1]];
function muTone(type,f,t0,d,v,dest,atk){const c=Mu.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+(atk||.012));g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest||Mu.g);o.start(t0);o.stop(t0+d+.05)}
function muSweep(type,f0,f1,t0,d,v,dest){const c=Mu.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest||Mu.g);o.start(t0);o.stop(t0+d+.03)}
function muNoise(t0,d,v,ft,fq,q,dest){const c=Mu.ctx,s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=Mu.nb;f.type=ft;f.frequency.value=fq;f.Q.value=q||.7;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(dest||Mu.g);s.start(t0,Math.random()*.1);s.stop(t0+d+.02)}
function muLevel(){return(net.state==='game'&&C&&C.z)?Math.min(3,1+Math.floor(C.z.ph/2)):0}
function muSched(){const c=Mu.ctx;if(!c)return;if(c.state!=='running'){try{c.resume()}catch(e){}return}
 const sd=60/100/4,lv=muLevel();
 while(Mu.t<c.currentTime+.4){const st=Mu.step%64,bar=st>>4,k=st%16,t0=Mu.t;
  if(k===0)for(const f of CH[bar])muTone('triangle',f,t0,sd*15.5,lv?.03:.04,Mu.g,.6);
  if([0,3,6,8,11,14].includes(k))muTone('sawtooth',RT[bar]*(k===6||k===14?2:1),t0,sd*2.2,lv?.2:.12,Mu.bf);
  if(lv>=1||k%2===0){const n=CH[bar][[0,1,2,1][k%4]]*2;muTone('square',n,t0,sd*1.4,lv?.032:.02,Mu.af)}
  if(lv>=1&&k%2===0){const m=MOT[bar][k>>1];if(m>=0){muTone('triangle',SCL[m],t0,sd*3,.07,Mu.af);muTone('square',SCL[m]/2,t0,sd*2,.02,Mu.af)}}
  if(lv>=1){const f4=lv>=2||k===0||k===8;if(k%4===0&&f4)muSweep('sine',150,42,t0,.16,.75);if(k===4||k===12)muNoise(t0,.14,.28,'bandpass',2200,.8);
   if(lv>=3&&k===14)muSweep('sine',150,42,t0,.16,.5);
   if(k%2===1||(lv>=2&&k%2===0))muNoise(t0,.04,lv>=2?.09:.06,'highpass',7500);if(lv>=3)muNoise(t0,.03,.05,'highpass',9000)}
  Mu.t+=sd;Mu.step++}}
function muInit(){if(Mu.ctx){if(Mu.ctx.state!=='running'){try{Mu.ctx.resume()}catch(e){}}return}
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=Mu.ctx=new A();
  Mu.m=c.createGain();Mu.m.gain.value=Mu.on?.9:0;const cp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=5;Mu.m.connect(c.destination);cp.connect(Mu.m);
  Mu.g=c.createGain();Mu.g.gain.value=.55;Mu.g.connect(cp);Mu.sx=c.createGain();Mu.sx.gain.value=.9;Mu.sx.connect(cp);
  Mu.bf=c.createBiquadFilter();Mu.bf.type='lowpass';Mu.bf.frequency.value=420;Mu.bf.connect(Mu.g);
  Mu.af=c.createGain();const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;Mu.af.connect(lp);lp.connect(Mu.g);
  const dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();dl.delayTime.value=.3;fb.gain.value=.32;wet.gain.value=.5;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(Mu.g);
  const b=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;Mu.nb=b;

function sx(){return Mu.ctx&&Mu.ctx.state==='running'&&Mu.on}
function sfxShot(w,gd,v){if(!sx()||v<=.02)return;const t=Mu.ctx.currentTime,P={pistol:[.09,1800,.55,170,.9],smg:[.05,2400,.45,210,.7],rifle:[.13,1000,.7,140,1],shotgun:[.26,520,1,95,1.3],sniper:[.42,700,1,85,1.4]}[w]||[.1,1500,.5,160,.9];
 muNoise(t,P[0],P[2]*v,'bandpass',P[1],.7,Mu.sx);muSweep('sine',P[3]*1.6,P[3]*.35,t,.16,.8*v*P[4],Mu.sx);
 if(w==='sniper'||w==='shotgun')muNoise(t+.03,.5,.22*v,'lowpass',800,.5,Mu.sx);if(gd){muSweep('sawtooth',900,200,t,.22,.14*v,Mu.sx);muTone('square',1400,t,.12,.05*v,Mu.sx)}}
function sfx(n,v){if(!sx())return;v=v==null?1:v;const c=Mu.ctx,t=c.currentTime,D=Mu.sx;
 if(n==='ui')muTone('square',720,t,.05,.05,D);
 else if(n==='pickup'){muTone('square',520,t,.06,.09*v,D);muTone('square',780,t+.06,.09,.09*v,D)}
 else if(n==='buy'){muTone('triangle',1318,t,.12,.14*v,D);muTone('triangle',1760,t+.09,.28,.14*v,D);muNoise(t,.05,.1,'highpass',6000,.7,D)}
 else if(n==='coin'){muTone('triangle',1568,t,.07,.07*v,D);muTone('triangle',2093,t+.05,.12,.06*v,D)}
 else if(n==='ammo'){muNoise(t,.04,.25,'bandpass',3000,2,D);muNoise(t+.08,.05,.25,'bandpass',2200,2,D)}
 else if(n==='drop'){muSweep('sine',200,60,t,.15,.5,D);muNoise(t,.05,.2,'lowpass',900,.7,D)}
 else if(n==='swap'){muNoise(t,.05,.3,'bandpass',1800,3,D);muTone('square',300,t+.02,.05,.04,D)}
 else if(n==='reload'){muNoise(t,.05,.35,'bandpass',1400,3,D);muTone('square',260,t,.06,.05,D);muNoise(t+.22,.06,.35,'bandpass',1000,3,D)}
 else if(n==='reloaded'){muNoise(t,.04,.4,'bandpass',2600,3,D);muTone('square',420,t,.05,.06,D);muNoise(t+.09,.06,.4,'bandpass',1500,3,D)}
 else if(n==='healstart'){muSweep('sine',300,620,t,.6,.12,D);muSweep('sine',305,625,t+.05,.6,.08,D)}
 else if(n==='healdone'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>muTone('triangle',f,t+i*.07,.35,.12,D))}
 else if(n==='vest'){muNoise(t,.12,.3,'lowpass',700,.7,D);muTone('triangle',330,t,.18,.1,D)}
 else if(n==='hit'){muTone('square',1500,t,.04,.12,D);muTone('square',2100,t+.035,.05,.1,D)}
 else if(n==='hurt'){muSweep('sawtooth',160,50,t,.18,.35*v,D);muNoise(t,.1,.35*v,'lowpass',1200,.7,D)}
 else if(n==='down'){for(let i=0;i<3;i++){muSweep('sine',90,50,t+i*.28,.2,.6,D)}}
 else if(n==='rescue'){[392,523.25,659.25,784].forEach((f,i)=>muTone('triangle',f,t+i*.09,.4,.14,D))}
 else if(n==='zone'){for(let i=0;i<3;i++){muSweep('sawtooth',500,800,t+i*.4,.35,.07,D);muSweep('sawtooth',800,500,t+i*.4+.2,.2,.05,D)}}
 else if(n==='air'){muSweep('sawtooth',200,420,t,1,.12,D);muSweep('sawtooth',210,430,t+.02,1,.1,D)}
 else if(n==='airland'){muSweep('sine',120,30,t,.5,.8,D);muNoise(t,.6,.3,'lowpass',500,.7,D)}
 else if(n==='open'){muNoise(t,.08,.3,'bandpass',900,2,D);muTone('square',480,t+.05,.08,.07,D)}
 else if(n==='kill'){muSweep('square',600,150,t,.3,.1,D)}
 else if(n==='win'){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>muTone('triangle',f,t+i*.12,.5,.15,D))}
 else if(n==='lose'){[392,330,262,196].forEach((f,i)=>muTone('triangle',f,t+i*.18,.5,.13,D))}}
function sfxDiff(pm,cm){if(!pm||!cm||!pm.alive)return;
 const wt=m=>m.w.map(s=>s?s.t+(s.gd?'*':''):'-').join(',');
 if(pm.$>cm.$)sfx('buy');else if(cm.$>pm.$)sfx('coin',.8);
 if(wt(pm)!==wt(cm)){const dropped=pm.w.filter(Boolean).length>cm.w.filter(Boolean).length;if(dropped)sfx('drop');else if(pm.cur!==cm.cur&&wt(pm)===wt(cm)){}else sfx('pickup')}
 else if(pm.cur!==cm.cur)sfx('swap');
 const at=m=>Object.values(m.am).reduce((a,b)=>a+b,0);if(at(cm)>at(pm)&&!(pm.rel&&!cm.rel))sfx('ammo');
 if(cm.med>pm.med)sfx('pickup');else if(cm.med<pm.med&&!cm.use&&!pm.use)sfx('drop');
 if(cm.ar>pm.ar)sfx('vest');
 if(cm.use&&!pm.use)sfx('healstart');if(pm.use&&!cm.use&&cm.hp>pm.hp)sfx('healdone');
 if(cm.rel&&!pm.rel)sfx('reload');if(pm.rel&&!cm.rel)sfx('reloaded');
 if(cm.dn&&!pm.dn)sfx('down');}
